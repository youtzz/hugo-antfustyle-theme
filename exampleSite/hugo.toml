baseURL = "https://youtzz.github.io/hugo-antfustyle-theme/"
locale = "zh-CN"
title = "Hugo Antfustyle Theme Example"
theme = "hugo-antfustyle-theme"

[params]
  description = "Minimal Hugo port of antfu.me visuals — sample site"
  homeIntro = "Example content for [hugo-antfustyle-theme](https://github.com/youtzz/hugo-antfustyle-theme). For a live production site, see **[keiwake.com](https://keiwake.com)**."
  homeAbout = "This demo stays sample-ish on purpose. Layout, typewriter typography, year-grouped lists, and ArtPlum / ArtDots decorations are what the theme ships."
  homeRecentTitle = "Recent posts"
  homeAllPostsLabel = "View all posts"

  # Theme credit in footer (default: on). Set false to hide.
  # themeCredit = false

  # Page decoration: registry + selector (see README)
  [params.art]
    active = "random"          # off | plum | dots | random
    pool = ["plum", "dots"]

  # Optional: register custom art (needs a script under assets/)
  # [params.art.extra.spark]
  #   script = "js/art-spark.js"

  [[params.homeGroups]]
    label = "Writing about"
    [[params.homeGroups.items]]
      name = "Tech"
      url = "/tags/技术/"
    [[params.homeGroups.items]]
      name = "Life"

[[menus.main]]
  name = "Posts"
  url = "/posts/"
  weight = 10
